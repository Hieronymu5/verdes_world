<div class="geo-guesser-shell">
  @if (state().cGFhcwZWk === 'stuver') {
    <div class="stuver-cGFhcw-ZWk" aria-hidden="true">
      {{ stuverText }}
    </div>
  }

  @switch (state().status) {
    @case ('difficulty') {
      <app-difficulty-select />
    }

    @case ('team-select') {
      <app-team-select />
    }

    @case ('playing') {
      <app-game-hud />
      <main class="game-area" aria-label="Game area">
        <app-world-map
          [player]="state().currentPlayer"
          [showPlayerName]="state().showPlayerName"
          [lastGuessResult]="state().lastGuessResult"
          [playerTimeElapsed]="state().playerTimeElapsed"
          [countryColors]="state().selectedWorldCupTeam?.colors ?? null"
        />
        <app-player-guess />
      </main>
    }

    @case ('game-over') {
      <app-game-over />
    }
  }
</div>
