<div class="geo-guesser-shell">
  @if (state().easterEgg === 'stuver') {
    <div class="stuver-easter-egg" aria-hidden="true">
      STUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUU
    </div>
  }

  @switch (state().status) {
    @case ('difficulty') {
      <app-difficulty-select />
    }

    @case ('playing') {
      <app-game-hud />
      <main class="game-area" aria-label="Game area">
        <app-world-map
          [player]="state().currentPlayer"
          [showPlayerName]="state().showPlayerName"
          [lastGuessResult]="state().lastGuessResult"
        />
        <app-player-guess />
      </main>
    }

    @case ('game-over') {
      <app-game-over />
    }
  }
</div>
