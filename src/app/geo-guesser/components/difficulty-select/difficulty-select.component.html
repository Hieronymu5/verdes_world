<div class="select-screen" role="main">
  <div class="branding">
    <span class="crest" aria-hidden="true">
      <span class="globe globe-1">🌍</span>
      <span class="globe globe-2">🌎</span>
      <span class="globe globe-3">🌏</span>
    </span>
    <h1 class="title">
      Verdes World
    </h1>
  </div>

  <nav aria-label="Difficulty selection">
    <ul class="difficulty-list">
      @for (level of difficulties(); track level.id; let i = $index) {
        <li>
          <button
            #difficultyBtn
            [class]="
              'difficulty-card difficulty-' + level.id + (i === selectedIndex() ? ' selected' : '')
            "
            [attr.tabindex]="i === selectedIndex() ? 0 : -1"
            [attr.aria-pressed]="i === selectedIndex()"
            [attr.aria-label]="'Start game on ' + level.name + ' difficulty. ' + level.description"
            (focus)="onCardFocus(i)"
            (click)="onCardClick(level, i)"
          >
            <div class="card-id">{{ level.id }}</div>
            <div class="card-name">{{ level.name }}</div>
            <div class="card-stats">
              <span class="stat">
                <span class="stat-icon" aria-hidden="true">⏱</span>
                {{ level.gameDurationSeconds / 60 }} min
              </span>
              <span class="stat">
                <span class="stat-icon" aria-hidden="true">💚</span>
                {{ level.lives }} {{ level.lives === 1 ? 'life' : 'lives' }}
              </span>
              <span class="stat">
                <span class="stat-icon" aria-hidden="true">⚽</span>
                {{ level.minGamesPlayed === -1 ? 0 : level.minGamesPlayed }} matches
              </span>
            </div>
          </button>
        </li>
      }
    </ul>
  </nav>

  <footer class="select-footer">
    <a routerLink="/about" class="about-link">About & Resources</a>
  </footer>
</div>
